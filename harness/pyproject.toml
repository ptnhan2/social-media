[project]
name = "isaacverse-harness"
version = "0.1.0"
description = "Self-improving video agent harness on LangChain Deep Agents"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.1",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
