services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 10s
      timeout: 5s
      retries: 5

  langgraph:
    build:
      context: .
      dockerfile: docker/Dockerfile.langgraph
    env_file: .env
    environment:
      - POSTGRES_URL=postgresql://harness:${POSTGRES_PASSWORD:-harness_dev}@postgres:5432/harness
    volumes:
      - ./libraries:/app/libraries
      - ./projects:/app/projects
      - ./harness/memories:/app/harness/memories
      - ./harness/skills:/app/harness/skills
    ports:
      - "2024:2024"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - langgraph
    restart: unless-stopped

volumes:
  pgdata:
