<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460">
  <!-- Branded head medallion — the identity anchor of the character system.
       Same head design appears in every pose (see docs/CHARACTER-PRESENCE-SPEC.md). -->
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="185" fill="#10161f"/>
  <circle cx="200" cy="200" r="185" fill="url(#glow)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <!-- head silhouette -->
  <path d="M200 96c-40 0-68 30-68 70 0 22-6 34-18 44 14 10 26 14 34 15v22c0 26-24 38-52 46 26 30 42 43 104 43s78-13 104-43c-28-8-52-20-52-46v-22c8-1 20-5 34-15-12-10-18-22-18-44 0-40-28-70-68-70z" fill="#1d2c3a" stroke="url(#ring)" stroke-width="6" stroke-linejoin="round"/>
  <!-- minimal face hints -->
  <circle cx="182" cy="176" r="6" fill="#61d7e8"/>
  <circle cx="220" cy="176" r="6" fill="#61d7e8"/>
  <path d="M186 206q15 10 30 0" stroke="#61d7e8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- shoulders -->
  <path d="M96 444c18-58 56-84 104-84s86 26 104 84" fill="none" stroke="#28414f" stroke-width="10" stroke-linecap="round"/>
</svg>
