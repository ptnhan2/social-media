name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install harness deps
        run: |
          python -m venv harness/.venv
          harness/.venv/bin/pip install "deepagents[video]" langchain-deepseek langgraph-cli[inmem] langchain langgraph langsmith openevals pillow numpy langchain-openai
      - name: Create .env placeholder
        run: |
          echo "DEEPSEEK_API_KEY=test" > .env
          echo "ZHIPU_API_KEY=test" >> .env
          echo "LANGSMITH_API_KEY=test" >> .env
          echo "LANGSMITH_TRACING=false" >> .env
          echo "OPENAI_API_KEY=dummy-ci" >> .env
          echo "HARNESS_MODEL=openai:glm-4-flash" >> .env
      - name: Unit tests (domain tools)
        run: harness/.venv/bin/python harness/test_unit.py
      - name: Agent compiles
        run: harness/.venv/bin/python -c "import sys; sys.path.insert(0,'harness'); from agent import agent; print('OK')"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install composer-app deps
        run: cd remotion-composer/composer-app && npm ci
      - name: Build Composer
        run: cd remotion-composer/composer-app && npx vite build

  ts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install remotion deps
        run: cd remotion-composer && npm ci
      - name: styleLoader tests
        run: cd remotion-composer && npx vitest run shared/isaacverse/styleLoader.test.ts
