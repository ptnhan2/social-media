name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install harness deps
        run: |
          python -m venv harness/.venv
          harness/.venv/bin/pip install deepagents langchain-deepseek langgraph-cli[inmem] langchain langgraph jsonschema
      - name: Create .env placeholder
        run: |
          echo "DEEPSEEK_API_KEY=test" > .env
          echo "ZHIPU_API_KEY=test" >> .env
      - name: Governance tests
        run: harness/.venv/bin/python harness/test_governance.py
      - name: GovernedBackend tests
        run: harness/.venv/bin/python harness/test_governed_backend.py
      - name: Unit tool tests
        run: harness/.venv/bin/python harness/test_unit_tools.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        run: cd harness/frontend && npm ci
      - name: Build frontend
        run: cd harness/frontend && npx vite build

  ts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install remotion deps
        run: cd remotion-composer && npm ci
      - name: styleLoader tests
        run: cd remotion-composer && npx vitest run shared/isaacverse/styleLoader.test.ts
